    <meta property="og:title" content="Connect | Rajnish Yadav">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yrajnishds.github.io/connect/">
    <meta property="twitter:title" content="Connect | Rajnish Yadav">
    <meta property="twitter:description" content="Contact Rajnish Yadav for academic discussions, research opportunities, and collaborations in Data Science and AI.">

    <link rel="icon" href="../assets/images/favicon.png">
    
    <link rel="stylesheet" href="../assets/global/variables.css">
    <link rel="stylesheet" href="../assets/global/base.css">
    <link rel="stylesheet" href="../components/navbar/navbar.css">
    <link rel="stylesheet" href="../components/footer/footer.css">
    
    <style>
        .connect-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 2rem;
            margin-top: 3rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .social-card {
            display: flex;
            align-items: center;
            padding: 2rem;
            gap: 1.5rem;
            text-decoration: none;
            transition: all var(--transition-normal);
            border-radius: var(--radius-lg);
        }

        .social-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--brand-color, var(--accent-teal));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .social-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .social-card:hover .social-icon {
            background: var(--brand-color, var(--accent-teal));
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--brand-color, var(--accent-teal));
        }

        .social-info {
            display: flex;
            flex-direction: column;
        }

        .social-name {
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .social-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div id="navbar"></div>

    <main>
        <section class="section">
            <div class="container reveal">
                <h1 class="section-title">Get In Touch</h1>
                <p class="text-center text-secondary mb-5" style="max-width: 600px; margin: 0 auto;">
                    I am currently open to data science internships, research collaborations, and academic discussions. Connect with me on any of the platforms below.
                </p>

                <div class="connect-grid">
                    <!-- Email Primary -->
                    <a href="mailto:yrajnishds@gmail.com" class="card-panel social-card" style="--brand-color: #EA4335;">
                        <div class="social-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </div>
                        <div class="social-info">
                            <span class="social-name">Primary Email</span>
                            <span class="social-desc">yrajnishds@gmail.com</span>
                        </div>
                    </a>



                    <!-- LinkedIn -->
                    <a href="https://linkedin.com/in/yrajnishds" target="_blank" class="card-panel social-card" style="--brand-color: #0077B5;">
                        <div class="social-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                        </div>
                        <div class="social-info">
                            <span class="social-name">LinkedIn</span>
                            <span class="social-desc">Professional Network</span>
                        </div>
                    </a>

                    <!-- GitHub -->
                    <a href="https://github.com/yrajnishds" target="_blank" class="card-panel social-card" style="--brand-color: #333333;">
                        <div class="social-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                        </div>
                        <div class="social-info">
                            <span class="social-name">GitHub</span>
                            <span class="social-desc">Code & Projects</span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>window.PORTFOLIO_ROOT = '../';</script>
    <script src="../assets/global/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.loadComponent('navbar', '../components/navbar/navbar.html');
            window.loadComponent('footer-placeholder', '../components/footer/footer.html');
        });
    </script>
</body>
</html>
